[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "econ-calendar"
version = "1.0.0"
description = "ナスダックに影響する経済指標を Google カレンダーへ自動同期する"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.120.0",
  "google-auth>=2.29.0",
  "google-auth-oauthlib>=1.2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
econ-cal = "econ_cal.cli:main"

[tool.setuptools]
packages = ["econ_cal", "econ_cal.providers"]

[tool.setuptools.package-data]
econ_cal = ["data/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4"]
