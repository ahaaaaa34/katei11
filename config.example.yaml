# ===========================================================================
#  econ-calendar 設定ファイル
#  このファイルを config.yaml にコピーして編集してください。
#  すべて省略可能で、書かなかった項目は既定値が使われます。
# ===========================================================================

# 予定を表示するタイムゾーン
timezone: Asia/Tokyo

calendar:
  # この名前のカレンダーを探し、無ければ自動で作成します。
  name: "経済指標 (Nasdaq)"
  # 既存のカレンダーに入れたい場合はその ID を指定（name より優先）
  id: null
  description: "ナスダックに影響する経済指標を自動同期しています。"

window:
  days_ahead: 60   # 何日先まで登録するか
  days_back: 5     # 何日前まで遡って更新するか（発表後の結果値を取り込むため）

filter:
  # ナスダックへの影響度スコアがこの値以上の指標だけを登録します。
  #   90+ 最重要 (CPI, 雇用統計, FOMC)
  #   75+ 重要   (PPI, ISM, 小売売上高 …)
  #   55+ 注目   (地区連銀サーベイ, 住宅 …)
  min_impact: 55
  countries: [US, JP, EU, CN]
  categories: []          # 空 = 全部。例: [fed, inflation, labor]
  include: []             # スコアに関係なく必ず入れる指標 id
  exclude: []             # 常に除外する指標 id

providers:
  rules: true             # オフラインのスケジュール推定（キー不要）
  fomc: true              # FOMC など中央銀行会合（meetings.yaml）
  market: true            # 休場・短縮取引・SQ・指数リバランス

  # FRED（セントルイス連銀）。無料 API キーで発表日が公式の確定値になります。
  #   https://fred.stlouisfed.org/docs/api/api_key.html
  fred:
    enabled: auto         # auto = FRED_API_KEY があれば有効
    api_key_env: FRED_API_KEY

  # Investing.com。予想値・前回値・結果値が入る唯一の情報源ですが、
  # 公式 API ではないため既定では無効です。自己責任で有効化してください。
  investing:
    enabled: false
    timeout: 20
    timezone_id: 55       # サイト内部のタイムゾーン ID
    assume_tz: UTC        # 上の ID が指すタイムゾーン（ズレたらここを直す）

  # ナスダック100の主要銘柄の決算。指標より指数を動かすことがあります。
  earnings:
    enabled: true
    tickers:
      NVDA: 95
      AAPL: 88
      MSFT: 88
      GOOGL: 85
      AMZN: 85
      META: 84
      TSLA: 80
      AVGO: 80
      TSM: 70
      AMD: 72
      NFLX: 68
      ORCL: 60
      MU: 62
      COST: 55
      ADBE: 55
      PLTR: 55

display:
  impact_emoji: true      # 🔴🟠🟡⚪ を件名の先頭に付ける
  show_country_flag: true
  show_score: false       # 件名にスコアを出す

# 通知（イベント開始前の分数）。ランクごとに指定します。
reminders:
  S: [1440, 30]           # 前日 + 30分前
  A: [30]
  B: []
  C: []

# Google カレンダーの色 ID
colors:
  S: "11"                 # 赤
  A: "6"                  # オレンジ
  B: "5"                  # 黄
  C: "8"                  # グレー

digest:
  enabled: true
  weekly_event: true      # 月曜に「今週の注目指標」を終日予定として作る
  webhook_url_env: ECON_CAL_WEBHOOK_URL   # Slack / Discord の Webhook URL

auth:
  client_secret_file: credentials.json
  token_file: token.json
