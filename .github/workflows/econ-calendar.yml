name: 経済指標カレンダー同期

on:
  schedule:
    # 毎朝 06:00 JST — その日の予定を確定させる
    - cron: "0 21 * * *"
    # 平日 20:00 JST — 直近の発表結果を取り込む
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "書き込まずに差分だけ表示する"
        type: boolean
        default: false
      days_ahead:
        description: "何日先まで同期するか"
        type: string
        default: "60"

# 同じカレンダーに同時に書き込まないようにする
concurrency:
  group: econ-calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 依存関係をインストール
        run: pip install -r requirements.txt

      - name: 認証情報の有無を確認
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          if [ -z "$GOOGLE_TOKEN_JSON" ]; then
            echo "::error::シークレット GOOGLE_TOKEN_JSON が未設定です。"
            echo "ローカルで 'python -m econ_cal auth' を実行し、生成された"
            echo "token.json の中身をリポジトリの Secrets に登録してください。"
            exit 1
          fi

      - name: 設定を点検
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        # doctor は未登録の会合日程などを警告として返すため、失敗させない
        run: python -m econ_cal doctor || true

      - name: カレンダーへ同期
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECON_CAL_WEBHOOK_URL: ${{ secrets.ECON_CAL_WEBHOOK_URL }}
          ECON_CAL_DAYS_AHEAD: ${{ inputs.days_ahead || '60' }}
        shell: bash
        # pipefail が無いと tee の成功で sync の失敗が隠れてしまう
        run: |
          set -o pipefail
          python -m econ_cal sync \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 週次ダイジェストを通知（日本時間の月曜朝のみ）
        if: github.event_name == 'schedule' && success()
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECON_CAL_WEBHOOK_URL: ${{ secrets.ECON_CAL_WEBHOOK_URL }}
        shell: bash
        run: |
          # 朝の回だけを対象にする（20:00 JST の回で二重送信しない）。
          # GitHub の cron は数十分ずれることがあるので幅を持たせる。
          if [ "$(TZ=Asia/Tokyo date +%u)" = "1" ] \
             && [ "$(TZ=Asia/Tokyo date +%-H)" -lt 12 ] \
             && [ -n "$ECON_CAL_WEBHOOK_URL" ]; then
            python -m econ_cal digest --days 7 --post
          else
            echo "対象外（月曜朝以外、または Webhook 未設定）のためスキップ"
          fi
