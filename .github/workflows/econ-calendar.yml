name: 経済指標カレンダー同期

on:
  schedule:
    # 毎朝 06:00 JST — その日の予定を確定させる
    - cron: "0 21 * * *"
    # 平日 20:00 JST — 直近の発表結果を取り込む
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "書き込まずに差分だけ表示する"
        type: boolean
        default: false
      days_ahead:
        description: "何日先まで同期するか"
        type: string
        default: "60"

# 同じカレンダーに同時に書き込まないようにする
concurrency:
  group: econ-calendar-sync
  cancel-in-progress: false

permissions:
  contents: write   # 60日ルール対策の keepalive コミット用
  issues: write     # 手当てが必要になったら Issue で知らせる

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 依存関係をインストール
        run: pip install -r requirements.txt

      - name: 認証情報の有無を確認
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          if [ -z "$GOOGLE_TOKEN_JSON" ]; then
            echo "::error::シークレット GOOGLE_TOKEN_JSON が未設定です。"
            echo "ローカルで 'python -m econ_cal auth' を実行し、生成された"
            echo "token.json の中身をリポジトリの Secrets に登録してください。"
            exit 1
          fi

      - name: カレンダーへ同期
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECON_CAL_WEBHOOK_URL: ${{ secrets.ECON_CAL_WEBHOOK_URL }}
          ECON_CAL_DAYS_AHEAD: ${{ inputs.days_ahead || '60' }}
        shell: bash
        # pipefail が無いと tee の成功で sync の失敗が隠れてしまう
        run: |
          set -o pipefail
          python -m econ_cal sync \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # ---- ここから下は「放置しても壊れない」ための見張り ----

      - name: 手当てが必要な項目を点検
        id: maintenance
        shell: bash
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set +e
          report=$(python -m econ_cal maintenance)
          code=$?
          set -e
          echo "$report"
          {
            echo "needs_action=$([ "$code" = "3" ] && echo true || echo false)"
            echo "report<<REPORT_EOF"
            echo "$report"
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 要対応なら Issue を立てる
        if: steps.maintenance.outputs.needs_action == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.maintenance.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          title="[econ-calendar] メンテナンスが必要です"
          # 既に開いている同じ Issue があれば何もしない（1日2回の実行で荒らさない）
          existing=$(gh issue list --state open --search "$title in:title" \
                       --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Issue #$existing が既にあります。何もしません。"
            exit 0
          fi
          {
            printf '自動同期は動いていますが、このままだと予定が欠けます。\n\n'
            printf '%s\n\n' "$REPORT"
            printf '直したらこの Issue を閉じてください。次回以降また必要になれば作り直されます。\n\n'
            printf '実行ログ: %s\n\n' "$RUN_URL"
            printf -- '---\n'
            printf '_Generated by [Claude Code](https://claude.ai/code)_\n'
          } > issue-body.md
          gh issue create --title "$title" --body-file issue-body.md
          rm -f issue-body.md

      # 公開リポジトリのスケジュール実行は、60日間コミットが無いと GitHub に
      # 自動停止される。放置していると静かにカレンダーが止まるので、
      # しばらくコミットが無いときだけ空に近い更新を1つ入れて延命する。
      - name: スケジュール停止を防ぐ (keepalive)
        if: github.event_name == 'schedule' && vars.ECON_CAL_KEEPALIVE != 'off'
        shell: bash
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "最終コミットから ${age_days} 日"
          if [ "$age_days" -lt 40 ]; then
            echo "まだ余裕があるのでスキップ"
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-run.txt
          git commit -m "chore: keepalive でスケジュール実行を維持する [skip ci]"
          git push

      - name: 週次ダイジェストを通知（日本時間の月曜朝のみ）
        if: github.event_name == 'schedule' && success()
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECON_CAL_WEBHOOK_URL: ${{ secrets.ECON_CAL_WEBHOOK_URL }}
        shell: bash
        run: |
          # 朝の回だけを対象にする（20:00 JST の回で二重送信しない）。
          # GitHub の cron は数十分ずれることがあるので幅を持たせる。
          if [ "$(TZ=Asia/Tokyo date +%u)" = "1" ] \
             && [ "$(TZ=Asia/Tokyo date +%-H)" -lt 12 ] \
             && [ -n "$ECON_CAL_WEBHOOK_URL" ]; then
            python -m econ_cal digest --days 7 --post
          else
            echo "対象外（月曜朝以外、または Webhook 未設定）のためスキップ"
          fi

      - name: 失敗を通知
        if: failure()
        env:
          ECON_CAL_WEBHOOK_URL: ${{ secrets.ECON_CAL_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          message="⚠️ 経済指標カレンダーの自動同期が失敗しました。カレンダーは更新されていません。
          ログ: $RUN_URL"
          python -m econ_cal --offline notify "$message" || true
