name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: テスト
        run: npm test
      - name: 単一ファイル版が生成できること
        run: npm run bundle
      - name: 生成物が最新であること
        run: git diff --exit-code dist/Code.gs
