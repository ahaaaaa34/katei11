name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: テスト
        run: npm test
      - name: 単一ファイル版が生成できること
        run: npm run bundle
      - name: 生成物が最新であること
        run: git diff --exit-code dist/Code.gs

      - name: 呼ばれていない関数が無いこと
        run: npm run coverage

      # これまでに実際に起きた壊れ方の「型」が、他に残っていないかを
      # 実行せずに一括で見る（tools/lint.js）。
      - name: 過去の壊れ方が再発していないこと
        run: npm run lint

      # 利用者に見える出来上がりが、承認した見本から変わっていないこと。
      # 変わったなら「意図した変更か、事故か」を人が決める合図になる。
      - name: 出来上がりが見本どおりであること
        run: npm run golden

      # 変異の当て先が、いまのソースにまだ在ること。直した場所を後から
      # 書き換えると、変異の定義だけが古いまま残り、30分の全件実行まで
      # 気づけない（実際に何度も見落とした）。ここは数秒で終わる。
      - name: 変異の当て先が古くなっていないこと
        run: npm run mutate:check

      # 性質テストは乱数で設定を振る。種を変えて回し、既定の種では
      # たまたま通っているだけ、という状態を避ける。
      - name: 性質テストを別の種でも回す
        if: matrix.node-version == '22'
        run: FUZZ_SEED=${{ github.run_number }} FUZZ_N=250 npm test

      # 日付・タイムゾーン・祝日の計算を、Python で独立に書いたものと
      # 突き合わせる。実装とテストが同じ思い込みを共有していると見えない
      # 誤りを、別言語・別のタイムゾーン実装（zoneinfo と ICU）で炙り出す。
      - name: 独立実装と突き合わせる
        if: matrix.node-version == '22'
        run: npm run diff

  # テストが本当にバグを捕まえるかを検査する。修正を1つずつ巻き戻して、
  # 対応するテストが落ちなければ失敗させる。
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 変異ひとつごとにテスト一式（500件超）を回すので、1台では
    # 2時間を超える。飛ばし飛ばしに分けて、並べて回す。
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 変異テスト (${{ matrix.shard }})
        # 性質テストと通し試験の件数は絞る。変異の検出に必要なのは
        # 「性質が破れること」であって件数ではないため。件数を増やした
        # 探索は node ジョブの方でやっている。
        env:
          MUTATE_FUZZ_N: "8"
          MUTATE_LONG_RUN_DAYS: "5"
        run: python3 tools/mutate.py --shard ${{ matrix.shard }}
