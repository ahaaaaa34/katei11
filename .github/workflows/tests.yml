name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: テスト
        run: npm test
      - name: 単一ファイル版が生成できること
        run: npm run bundle
      - name: 生成物が最新であること
        run: git diff --exit-code dist/Code.gs

      - name: 呼ばれていない関数が無いこと
        run: npm run coverage

      # これまでに実際に起きた壊れ方の「型」が、他に残っていないかを
      # 実行せずに一括で見る（tools/lint.js）。
      - name: 過去の壊れ方が再発していないこと
        run: npm run lint

      # 性質テストは乱数で設定を振る。種を変えて回し、既定の種では
      # たまたま通っているだけ、という状態を避ける。
      - name: 性質テストを別の種でも回す
        if: matrix.node-version == '22'
        run: FUZZ_SEED=${{ github.run_number }} FUZZ_N=250 npm test

      # 日付・タイムゾーン・祝日の計算を、Python で独立に書いたものと
      # 突き合わせる。実装とテストが同じ思い込みを共有していると見えない
      # 誤りを、別言語・別のタイムゾーン実装（zoneinfo と ICU）で炙り出す。
      - name: 独立実装と突き合わせる
        if: matrix.node-version == '22'
        run: npm run diff

  # テストが本当にバグを捕まえるかを検査する。修正を1つずつ巻き戻して、
  # 対応するテストが落ちなければ失敗させる。
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 変異テスト
        # 46 通りの変異それぞれでテスト一式を回すので、性質テストの件数は
        # 絞る。変異の検出に必要なのは「性質が破れること」であって件数では
        # ないため。件数を増やした探索は node ジョブの方でやっている。
        env:
          MUTATE_FUZZ_N: "8"
        run: python3 tools/mutate.py
